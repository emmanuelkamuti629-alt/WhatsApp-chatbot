<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp AI Chatbot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #111;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 520px;
      padding: 32px;
    }
    h1 { font-size: 24px; margin-bottom: 4px; color: #075e54; }
    .sub { color: #667781; font-size: 14px; margin-bottom: 24px; }
    .status {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; border-radius: 10px;
      background: #f0f2f5; font-size: 14px; margin-bottom: 20px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #999; }
    .dot.online { background: #25d366; box-shadow: 0 0 8px #25d366; }
    .dot.offline { background: #e53935; }
    label { display: block; font-size: 13px; font-weight: 600; color: #3b4a54; margin-bottom: 6px; }
    input, textarea {
      width: 100%; padding: 12px 14px; border: 1px solid #d1d7db;
      border-radius: 10px; font-size: 14px; font-family: inherit;
      outline: none; transition: border-color 0.2s;
    }
    input:focus, textarea:focus { border-color: #25d366; }
    textarea { resize: vertical; min-height: 100px; }
    .field { margin-bottom: 16px; }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      background: #25d366; color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: #1da851; }
    button:disabled { background: #a0d9b7; cursor: not-allowed; }
    #response { margin-top: 16px; font-size: 13px; color: #667781; text-align: center; }
    .qr-box {
      margin-top: 20px; padding: 16px; background: #f0f2f5;
      border-radius: 10px; text-align: center; font-size: 13px;
    }
    .qr-box a { color: #128c7e; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>WhatsApp AI Chatbot</h1>
    <p class="sub">Control panel &amp; status</p>

    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">Checking status...</span>
    </div>

    <div class="field">
      <label for="to">Send to (phone with country code, e.g. 254712345678)</label>
      <input id="to" type="tel" placeholder="254712345678" />
    </div>
    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" placeholder="Type a message..."></textarea>
    </div>
    <button id="sendBtn">Send Message</button>
    <div id="response"></div>

    <div class="qr-box">
      <strong>First time?</strong> Scan the QR code in your terminal with
      <br />WhatsApp → Linked Devices → Link a Device.
    </div>
  </div>

  <script>
    const dot = document.getElementById('dot');
    const statusText = document.getElementById('statusText');
    const sendBtn = document.getElementById('sendBtn');
    const responseEl = document.getElementById('response');

    async function checkStatus() {
      try {
        const res = await fetch('/health');
        const data = await res.json();
        if (data.whatsappReady) {
          dot.className = 'dot online';
          statusText.textContent = `Bot "${data.bot}" is ONLINE`;
        } else {
          dot.className = 'dot offline';
          statusText.textContent = `Bot "${data.bot}" is starting... scan QR in terminal`;
        }
      } catch {
        dot.className = 'dot offline';
        statusText.textContent = 'Server unreachable';
      }
    }

    sendBtn.addEventListener('click', async () => {
      const to = document.getElementById('to').value.trim();
      const message = document.getElementById('message').value.trim();
      if (!to || !message) {
        responseEl.textContent = '⚠️ Please fill in both fields.';
        return;
      }
      sendBtn.disabled = true;
      responseEl.textContent = 'Sending...';
      try {
        const res = await fetch('/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ to, message })
        });
        const data = await res.json();
        if (res.ok) {
          responseEl.textContent = '✅ Message sent!';
          document.getElementById('message').value = '';
        } else {
          responseEl.textContent = '❌ ' + (data.error || 'Failed to send');
        }
      } catch (err) {
        responseEl.textContent = '❌ ' + err.message;
      } finally {
        sendBtn.disabled = false;
      }
    });

    checkStatus();
    setInterval(checkStatus, 5000);
  </script>
</body>
</html>
